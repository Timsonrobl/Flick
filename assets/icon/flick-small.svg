<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Flick app icon, tuned for 16-24 px (tray, small taskbar): heavier lines
       and outline, no highlight, so the iris survives at one pixel per line. -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7F9"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <!-- Scaled to fill the canvas, like flick.svg. -->
  <g transform="translate(128 128) scale(1.08) translate(-128 -128)">
  <circle cx="128" cy="128" r="108" fill="url(#sweep)"/>
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round">
    <path d="M146 159.2 L107.5 225.9"/>
    <path d="M110 159.2 L33 159.2"/>
    <path d="M92 128 L53.5 61.3"/>
    <path d="M110 96.8 L148.5 30.1"/>
    <path d="M146 96.8 L223 96.8"/>
    <path d="M164 128 L202.5 194.7"/>
  </g>
  <path d="M164 128 L146 159.2 L110 159.2 L92 128 L110 96.8 L146 96.8 Z" fill="#241A44" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#241A44" stroke-width="18"/>
  </g>
</svg>
